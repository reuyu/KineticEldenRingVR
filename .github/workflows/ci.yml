name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

jobs:
  build:
    name: Build (Release, x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # MinHook, the ReShade headers, the OpenXR SDK and the bHaptics SDK are pulled by FetchContent on first configure.
      # Cache them so PR builds do not re-clone them every time.
      - name: Cache FetchContent sources
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      # Kinetic: PhysX comes from vcpkg (vcpkg.json). Use vcpkg at the manifest's baseline commit, and cache the
      # built PhysX package so only the first run (or a baseline change) pays for building it.
      - name: Set up vcpkg
        shell: pwsh
        run: |
          $baseline = (Get-Content vcpkg.json | ConvertFrom-Json).'builtin-baseline'
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP/vcpkg"
          git -C "$env:RUNNER_TEMP/vcpkg" checkout $baseline
          & "$env:RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/vcpkg-cache" | Out-Null
          "VCPKG_ROOT=$env:RUNNER_TEMP/vcpkg" | Out-File -Append $env:GITHUB_ENV
          "VCPKG_DEFAULT_BINARY_CACHE=$env:RUNNER_TEMP/vcpkg-cache" | Out-File -Append $env:GITHUB_ENV

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Configure
        run: cmake -S . -B build -A x64 -DKINETIC_REQUIRE_PHYSX=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Check the redistributable was assembled
        shell: pwsh
        run: |
          $expected = @(
            "build/dist/dxgi.dll",
            "build/dist/ReShade.ini",
            "build/dist/LICENSE-ReShade.txt",
            "build/dist/dinput8.dll",
            "build/dist/ERVR/ERVR.dll",
            "build/dist/ERVR/ERVR.ini",
            "build/dist/ERVR Launcher.exe"
          )
          $missing = $expected | Where-Object { -not (Test-Path $_) }
          if ($missing) { throw "missing from dist: $($missing -join ', ')" }
          Get-ChildItem -Recurse build/dist | Select-Object FullName, Length | Format-Table

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: ERVR-dist-${{ github.sha }}
          path: build/dist/

  signatures:
    name: AOB signature check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The script needs a game exe to scan, which CI does not have. This only guards against
      # the script itself breaking (syntax, imports) as it is edited.
      - name: Smoke-check tools/verify_signatures.py
        run: python -c "import ast,pathlib; ast.parse(pathlib.Path('tools/verify_signatures.py').read_text())"
