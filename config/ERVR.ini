; ERVR - native VR for ELDEN RING (own OpenXR session; no R.E.A.L. VR required)
; Edit while the game runs: most keys hot-reload within a second.
;
; Install: ReShade (the build WITH add-on support) goes in the game folder as dxgi.dll;
; ERVR.dll is loaded by the dinput8.dll proxy and registers itself as a ReShade add-on.
; If R.E.A.L. VR was installed, remove its files first: dxgi.dll, RealVR64.dll,
; openvr_api.dll, cudart64_12.dll, RealVR.ini.

[General]
Enabled=true
; debug | info | warn | error   (debug prints a heartbeat with controller values every 5 s)
LogLevel=info
; openxr - ERVR creates and owns its own session (Oculus/Link, VDXR and SteamVR all work).
VRRuntime=openxr
PollHz=250

[VR]
; off      - no rendering; ERVR is input/camera only (flat screen)
; cinema   - the flat game on a head-locked quad in the headset. Proves the whole pipeline; also
;            the permanent fallback for menus and cutscenes.
; debugalt - per-eye validation only, NOT the product (M1)
; full     - true stereo, both eyes at the same simulation time (M3)
StereoMode=full
; Full stereo only: task-group indices the draw-only second pass keeps active, as ranges.
; Default = CameraStep (106) + the camera-propagation family (118,123-125 - the MoveMap
; post-physics groups where the engine carries the camera into what the renderer actually
; consumes, found by the CamWatch census) + Draw_Pre..Draw_Post (144-158) + Flip (164).
; Without 118/123-125 pass 2 renders pass 1's captured camera no matter what the camera
; objects hold. Add 142 (ScaleformStep) if the HUD is missing from one eye. Hot-reloads.
Pass2Keep=106,118,123-125,144-158,164
; Full-frame second pass: run pass 2 as a COMPLETE engine frame. Every producer runs
; (environment lighting, UI, particles, ...), which is the fix for the draw-only pass's
; dark environment lighting. Costs more CPU than the draw-only pass. Numpad 5 toggles live.
Pass2FullFrame=true
; Pass2Dt: experimental float-dt freeze, keep 0 (off) - measured to never reach the sim
; (the engine only turns that float into frame-limiter ticks).
Pass2Dt=0
; THE pass-2 time lever (dt hunt concluded 2026-08-21): every task invocation builds its
; FD4TaskData on the stack, copying dt from ONE mutable global float (the measured wall
; dt; AOB-resolved from the fd4 builder in frame_probe.cpp). Pass2Steps>=0 swaps that
; global to ~0 around pass 2 - a complete engine frame that advances NOTHING = true
; same-sim-time stereo at correct speed, verified flat by the hb "igt" ratio staying
; ~1.0 while pumped. -1 = off (pass 2 runs at full dt again).
Pass2Steps=0
; Suppress engine DL_PANIC asserts that fire DURING pass 2 (the null-write is skipped and
; the panic function returns cleanly). Pass-2 asserts are spurious by construction - the
; second pass replays the frame over transition state pass 1 never sees; fast travel's
; fade-out fired two fatal ones on 2026-08-21. Pass-1 panics still crash (stack logged).
Pass2EatAsserts=true
; Groups the full-frame pass keeps. Excluded: PadStep (input replay), the resource
; lifecycle (ResStep, FLVER deletion window, FileStep, DelayDeleteStep, heap stats -
; deletion must tick once per REAL frame), and BOTH halves of the AI Lua GC bracket
; (85 AiBeginCollectGabage / 166 AiEndCollectGabage). Begin/End task pairs must be kept
; or gated TOGETHER: keeping 85 while gating 166 left "GC running" set and the engine
; deliberately panicked on the next AI Lua call (CSAiLua.cpp "Running GC!" - the crash of
; 2026-08-20). The world-origin shift pair 11/160 is KEPT - it brackets the INTER-frame
; window (Begin=160 late in a frame, End=11 early in the next), so gating it left pass 2
; running inside a half-applied origin rebase whenever the player walked far enough to
; trigger one: geometry shifting/teleporting/out-of-bounds starting ~1 min in
; (2026-08-20). Cloth (100-105 pre + 110-112 post, gated together) excluded 2026-08-21:
; the Havok cloth solver run twice per frame with pass 2's ~0 dt goes visibly unstable;
; gating it renders pass 1's cloth in pass 2 - the same sim instant, which is the point.
; The Havok RIGID-BODY solver is excluded for the same reason (2026-08-21, "dead enemy
; ragdolls and broken fences go haywire"): 97 HavokWorldUpdate_Pre + 99 HavokWorldUpdate_Post
; (gated together - they bracket the world step), 82 ChrIns_RagdollSafe, and the
; destructible map-prop feed 89-91 LocationUpdate_PrePhysics* + 92-94
; LocationUpdate_PostCloth* (each family whole). Ragdolls and broken geometry are free
; bodies with no animation re-driving them, so they are pure solver output - a second step
; at dt~0 divides by that dt in constraint recovery and flings them. 98 RenderingSystemUpdate
; sits between 97 and 99 and is the RENDERER, not physics - it stays kept.
; Hot-reloads; Numpad 2 cycles bracketing variants (set 1 = also gate the character
; pre/post-physics feed, if ragdolls still twitch; set 2 = physics back in, the reference).
; Full keep set. Gating warp groups here was tried twice on 2026-08-22 for the "fast travel
; or dying crashes" bug; both attempts made pass 2's image (the RIGHT eye under PresentLag=1)
; dark and per-object flickery - 10 GameFlowStep and 20 MoveMapStep each do per-frame work
; the render needs. The crash is a double-step of the transfer state machine, so the fix is
; to skip pass 2 entirely while a warp is in flight (the DoSecondPass guards), not to gate.
; Full set: pass 2 runs everything the day's crash hunt did not prove harmful. The
; GameFlowInGame_MoveMap_PostPhysics family (118, 123-125) is BOTH the pass-2 camera
; carrier (mms/follow/updFollow/finalize hang under it; gating it = no stereo depth,
; "same eye twice") AND the transition crasher (it walks world/chr grids that
; teardown and arrival rebuild under it). So it runs in steady play and is dropped by
; Pass2SafeKeep during the settle window - see below.
; Menu logic (29-31 menu task lines, 126 MenuMan, 134-136 GameFlowInGame_*Menu) gated out of pass 2
; 2026-08-24: PadStep (9) does not re-run in pass 2, so the START edge from pass 1 is still set and
; the pause menu - a START toggle - opened in pass 1 and closed again in pass 2 of the same pair.
; Network stepping gated out of pass 2 2026-10-31 (15, 28, 32-36, 39-42, 44, 47, 64, 80, 133,
; 137-140: FrpgNet, SessionManager, WorldChrMan_ChrNetwork, NetFlushSendData ...). Idle offline;
; in a Seamless Co-op session every connect state machine and packet flush ran twice per pair.
; Event scripts gated too (22-24 EmkSystem): run twice per pair, a dialog raised after an item pickup
; stayed on screen ignoring every button until a respawn. 25 EventMan stays in (2026-11-02): 0.6.0 gated
; it with the scripts, and doors, levers, lifts and new graces stopped answering the interact button.
; Both keep sets are built into ERVR and follow its updates while these two lines stay commented out. An
; uncommented line is yours and wins - except 0.6.0's own value and the 16-25 workaround posted for it,
; which ERVR replaces at load (ERVR.log says so).
;Pass2FullFrameKeep=0-7,10-14,16-21,25,27,37-38,43,45-46,48-63,65-79,81,83-84,86-88,95-96,98,106-109,113-125,127-132,141-142,144-160,164,168
; SAFE variant, used automatically while any pass-2 guard holds and for
; Pass2SafeSeconds after the last one releases. Differs from the full set only by the
; MoveMap_PostPhysics family: depth pauses briefly after loads instead of crashing
; (the arrival crash landed 13 s after resume; 20 covers it with margin).
;Pass2SafeKeep=0-7,10-14,16-21,25,27,37-38,43,45-46,48-63,65-79,81,83-84,86-88,95-96,98,106-109,113-117,119-122,127-132,141-142,144-160,164,168
Pass2SafeSeconds=1.5
; The transition ladder after a load: cinema quad while the spawn grace holds, then pass 2
; under the SAFE set, then the full set. Pass2FinalizeReplay (default on) replays the game's
; own camera finalizer inside SAFE-set passes so the second eye reaches the renderer without
; the MoveMap family - SAFE then has REAL DEPTH, and the ladder feels like cinema -> 3D with
; nothing flat in between. The graces below are how long the cinema step lasts; both were
; hardcoded higher when the arrival crashes were unexplained (their root causes - the
; blanket keep-set restore and the readback experiment - are fixed). Raise them if arrival
; crashes come back; all three hot-reload.
Pass2SpawnGraceSeconds=1
; Menu-close grace retired 2026-08-24: GameMan.warp_requested covers the travel confirm on
; the confirm frame itself, so closing a menu without traveling costs nothing.
Pass2MenuGraceSeconds=0
; The warp/teleport grace (>100 m one-frame camera jump = fast-travel or death-warp
; arrival). It STACKS with the spawn grace at every load, so it is sized to match.
Pass2WarpGraceSeconds=2
; Seamless Co-op: joining, hosting or leaving runs the game's own join state machine ("[coop]
; session lobby ... protocol ..." in the log), and another player's character appearing, leaving
; or finishing its load is a character-grid rebuild with no warp or loading signal. Pass 2 holds
; through both, then Pass2CoopGraceSeconds more.
Pass2CoopGraceSeconds=4
; SAFE set for the whole session: off - in a real session it gave no depth (same image in both
; eyes). Only for testing whether a steady-play co-op crash is the MoveMap family.
Pass2CoopSafe=false
Pass2FinalizeReplay=true
; SAFE keep set for this many seconds after EVERY A press. RETIRED 2026-08-23: the game's
; own warp signal (GameMan.warp_requested, set on the request frame of every warp) plus the
; loading-screen event byte now drive the transition guards, so ordinary A presses no
; longer cost stereo. Set back >0 only if the boot log says "GameMan AOB missed" on a new
; game patch. 0 = off. Hot-reloads.
Pass2SafeOnA=0
; Full-frame pass 2 re-runs the player's action-request update at steps 0, where a button press buffered in
; pass 1 can be re-judged against animation cancel windows the zero-length step never re-opened, and be gone
; before the next real frame ("items / d-pad / attacks only work while walking"). Snapshot the module's
; input-buffer fields and per-animation input/cancel queues before pass 2 and restore them after it, unless
; animation/equipment state changed or queue storage was replaced. Only applies with Pass2Steps=0.
; With [Combat] Debug=true, every press logs "[combat] adiag p1/p2 ..." request bits and queue masks. Hot-reloads.
Pass2KeepActionRequest=true
; Complete each pass's eye report with the camera the renderer REALLY used (read at pass
; end) instead of the camera we wrote. The game's own step re-smooths the camera after our
; write on ~every frame; submitting the un-smoothed pose with the smoothed image is
; head-motion skew. Turn off only to A/B the difference. Hot-reloads.
ReportFinalCamera=true
; Full stereo eye routing. ELDEN RING's renderer presents each pass's image one Present
; late (measured 2026-08-20: tilting only pass 2's camera tilted the LEFT eye under lag 0),
; so 1 is correct here: the XR frame opens at pass 2's present (whose image is pass 1's
; render = left eye) and closes at the next pass 1's (pass 2's render = right eye) - both
; eyes from ONE sim frame, each pose matching its content. Verify any renderer change with
; the Numpad 3 pitch probe: the eye showing the tilted world receives pass 2's content.
PresentLag=1
DebugPass2Pitch=0
; Drain the GPU between the two engine passes. The pump starts pass 2 while the GPU is still
; executing pass 1's draws; if the engine reuses the same per-frame upload memory for both
; passes, pass 2's uploads corrupt pass 1's image mid-read (per-object dark/flickering
; objects, worst in the left eye). 0 = off, 1 = drain before pass 2 (protects the left eye),
; 2 = also drain after pass 2 (protects both). Costs frame rate - it serialises CPU and GPU.
; Tested 2026-08-20: draining changed nothing visually, so it is OFF; kept for future A/B.
; Hot-reloads; Numpad 4 cycles it live.
GpuSync=0
; Numpad hotkeys for the stereo A/B tests, usable without taking the headset off. They only
; act when pressed, and each change buzzes both controllers so it can be confirmed blind:
;   Numpad 1 - PresentLag 0 <-> 1        (1 buzz = 0, 2 buzzes = 1)
;   Numpad 2 - cycle Pass2Keep sets      (N buzzes = Nth set: 1 default (+CameraStep),
;              2 no-CameraStep reference, 3 +DrawParamUpdate, 4 +RenderingSystemUpdate,
;              5 kitchen sink (+Geom_UpdateDraw +ScaleformStep))
;   Numpad 3 - DebugPass2Pitch 0 <-> 30  (tilts ONLY the second pass; the eye that shows the
;              tilted world is the one rendering pass 2)
;   Numpad 4 - cycle GpuSync 0 -> 1 -> 2 (1 buzz = 0, 2 = 1, 3 = 2)
;   Numpad 7 - HUD layer on/off             (1 buzz = off, 2 = on)
;   Numpad 8 - cycle [HUD] FirstDraw 0..8    (N+1 buzzes = value N)
;   Numpad . - re-centre the HUD panel on where you are looking (1 buzz)
;   Numpad 0 - re-log the current state (1 buzz)
; NumLock must be ON. Every press is written to ERVR.log, so the session can be read back.
DebugKeys=true
; Supersampling of the per-eye images. 1.0 = one eye pixel per delivered game pixel, which is
; all the information there is; raise it only to trade fill rate for slightly softer resampling.
RenderScale=1.0
; 1.0 = metric. Scales the distance between the eyes, so lower values make the world feel larger.
WorldScale=1.0
; Stereo pair rate. 0 = headset refresh / 2 (the compositor reprojects the gap).
PairRateHz=0
; Headset refresh rate to request at session start. 0 = keep the streamer's rate. Virtual
; Desktop only offers its current streaming rate to games, so with VD set the rate in VD
; itself (Streaming > Frame rate); the log names the rate and what the runtime supports.
HeadsetRefreshHz=0
; Raise the game's frame limiter ([Patches] FpsTarget) above the headset's refresh while VR
; runs. A limiter below the refresh can never meet it, and the runtime then drops the game to
; HALF rate and synthesizes the rest: FpsTarget 72 under a 90 Hz Quest 3 ran at a 45 Hz
; display period, ~52 stereo pairs/s - sluggish. The same machine ran ~88 pairs/s at 90 Hz
; with the limiter out of the way (RTX 5090 + 9800X3D, 3200x1800; the loop is CPU-bound there,
; ~11.3 ms of engine work per pair). Game speed is never affected; only the frame cap moves.
LimiterFollowsHeadset=true
; Cinema screen placement, in metres.
CinemaDistance=2.5
CinemaWidth=4.0
; Keep drawing to the monitor as well as the headset.
MirrorWindow=true
; Enable XR_EXT_debug_utils when the runtime offers it (verbose).
XrDebug=false
; Vertical FOV in degrees forced into the game camera while stereo is running. One rendered
; image has to contain a whole eye's field of view; the render thread then crops it down to
; the runtime's exact asymmetric FOV, so too wide only costs sharpness while too narrow costs
; field of view. 0 = AUTO: derive it from the headset (a Quest 3 needs ~110 vs ELDEN RING's
; own 43). Only set a number to override the automatic value.
FovDeg=0
; Which angle the game's camera FOV field means. If the world looks stretched or squashed in
; stereo but is fine in cinema, try the other one.
FovAxis=vertical
; The height (px) the game's camera FOV actually spans. Settled 2026-08-23 by the pitch
; probe (a KNOWN 10-deg camera pitch moved a landmark by exactly what the current-height
; model predicts, 2.3x what the boot-height model predicts): WRITING the FOV rebuilds the
; game's projection against the CURRENT frame height - and stereo writes it every frame.
; The 08-22 "boot-locked frustum" measurement was real but only holds when the FOV is
; never written; using it in play claimed ~1.9x too much angle per eye crop at oversize
; resolutions = magnified world, image dragging with head motion, hyper-magnified stereo.
;   0  = auto: the current frame height - the default and the measured behavior
;   >0 = explicit reference height in px, experiments only
; Hot-reloads.
GameRasterRefHeight=0
; Eye separation in mm, overriding what the runtime reports. 0 = trust the runtime (correct
; unless it is reporting the wrong IPD). Note that if the world merely feels too SMALL, the
; knob you want is WorldScale, not this one - they scale the same thing but mean different
; things, and only this one claims to be your physical IPD.
IpdMm=0
; Back-buffer colour encoding. auto converts gamma-encoded (LDR UNORM) output to the linear
; light the compositor expects - without it everything looks washed out. none | srgb to force.
ColorFix=auto
; Game render resolution for VR. Each eye is a CROP of the game's frame, so this IS the VR
; sharpness - and per-eye pixels track the frame's HEIGHT almost alone (a wider frame just
; widens the rendered FOV proportionally), which is why a near-square target beats 16:9.
; ERVR writes this into the game's OWN settings file, %APPDATA%\EldenRing\GraphicsConfig.xml
; - the same mechanism R.E.A.L. VR uses, and the reason no DSR and no in-game menu step are
; needed: the windowed size there is honoured even when it is larger than your monitor.
; Your original file is saved beside it as GraphicsConfig_ervr_backup.xml.
;   auto - the headset's recommended per-eye size, times GameResScale. Cached in
;          ERVR.cache.ini on the first run with the headset streaming (before that, a
;          Quest 3-sized default is used).
;   WxH  - exact override, e.g. 2736x2736 (R.E.A.L.'s own "ultra" preset for this game)
;   off  - leave the player's own resolution alone
; Sizes within 1% of 16:9 (auto always is) are set to EXACT 16:9, in steps of 128x72: the
; game renders a window even a few pixels off 16:9 as a 16:9 frame inside black bars, and
; the HUD layer cannot find the UI of that frame - menus, map and HUD stay in the eye images.
; Other shapes are kept (rounded to multiples of 8) and the letterbox patch removes the bars.
GameRes=auto
; Scales the auto target's height (1.0 = the headset's full pixel budget). ERVR renders the
; frame TWICE per stereo pair, so the GPU cost is double a flat game at the same size. 0.86
; is ~3200x1800 for a Quest 3 at Virtual Desktop's 2688x2880, which an RTX 5090 carries at
; ~88 pairs/s for a 90 Hz headset (GPU ~77%); 1.0 (3712x2088) was GPU-bound there (54-71
; pairs/s, VD fell back to half rate). Go higher at 72/80 Hz, lower on smaller GPUs. If the
; log warns "stereo pairs/s against a N Hz headset", lower this or the headset refresh.
; (Before 2026-10-31 the game silently snapped most targets DOWN to its nearest built-in size,
; ~3200x1800 here - so this value now means exactly what it says.) The result is the nearest
; exact 16:9 size on the 128x72 grid: 0.86 is 3200x1800 for a Quest 3 and 3584x2016 for a
; Quest Pro (VD recommends 3072x3264 per eye there - a bigger frame, so it may need less).
GameResScale=0.86
; Accept a render size larger than the desktop - the native alternative to NVIDIA DSR. The
; game's settings-apply pass skips any resolution-table entry bigger than the screen; this
; NOPs that check (found 2026-08-22 by the GameResScan census below) and lifts the Windows
; window-size clamp. With it on, GameRes=auto renders a 16:9 frame carrying the headset's
; full pixel budget (e.g. 4224x2376 for a 3072x3264 eye recommendation) - deliberately
; 16:9, never the eye-shaped frame of 2026-08-22/23: the game's projection carries a
; constant 16:9 aspect, and the near-square buffer that fought it is where the magnified
; world / head-motion skew / stretched weapons / lost depth all came from. A tall 16:9
; frame has exactly the geometry of the fitted frame stereo is proven on, just denser.
; GameResScale scales that frame's height (1.0 = the budget; the GPU cost is the same as
; the eye-shaped frame was). false = fit to the desktop instead.
GameResOversize=true
; Diagnostic that found the check: page-guard the patched resolution-table slots for the
; first GameResScanSeconds and log every reader/writer as "[reswatch]" lines (rip,
; registers, instruction bytes - and any Arxan repair reverting the slot). Off for play.
GameResScan=false
GameResScanSeconds=45

[HUD]
; The in-game UI on its own floating quad in world space, instead of painted into the frame
; the eyes are cropped from.
;
; Why it needs doing: in full stereo the game renders ONE very wide frame (the camera is
; widened to ~110 deg so a single image can hold a whole eye's field of view) and each eye is
; a crop of it. The HUD is laid out in SCREEN space, so the engine puts it along the edges of
; that widened frame - 50+ degrees off-axis, half of it outside the eye crop, the rest smeared
; across the periphery at the wrong depth. No camera setting can fix that: the HUD is not in
; the world, it is on the film.
;
; So ERVR takes it off the film. As a ReShade add-on it sees the game's D3D12 command stream:
; the moment the first UI draw of the frame is issued, the render target under it is swapped
; for a texture of ERVR's own, cleared transparent. The game's frame then comes out with NO UI
; in it (the eye crops are pure world) and ERVR's texture holds the UI alone, which is
; submitted as its own composition layer - blended over the world by the compositor, at
; headset resolution rather than at the game's.
;
; Note: the monitor mirror loses the HUD too, because the HUD is genuinely no longer in the
; frame. That is the feature working, not a bug. The redirect only runs while the eyes are
; stereo, though: flat frames (the title screen, loading screens, the map, cutscenes) go onto
; the cinema screen whole, UI and all - at the title the UI IS the whole picture. And with the
; headset not streaming the UI is left in the frame where it is at least visible; the log says
; so once.
;
; off  - leave the UI in the frame (what every version before this did)
; quad - lift it onto its own layer
; NOTE: this is the one key here that is NOT hot - it is read once at startup, because
; watching the draw stream costs something on every draw the game issues and a player who
; leaves it off should not pay for it. Changing it takes a restart. Everything else below
; (placement, size, FirstDraw, Key, ...) still hot-reloads while you play, and Numpad 7
; toggles the panel within a session that started with Mode=quad.
Mode=quad
; Which render target the UI is expected to be painted onto. Measured on 1.16.2 (2026-08-21)
; this MOVES during a session, which is why auto is the default:
;   * boot logos and the title screen paint their UI straight onto the back buffer - 3 draws
;     into it per frame, the first being the output blit and the other two the UI;
;   * once a save is loaded the engine tonemaps into a full-size offscreen R8G8B8A8 target,
;     draws ~24-56 HUD/Scaleform batches onto THAT, and copies the result to the back buffer
;     in one single draw.
;   backbuffer - pin it to the swapchain image (correct at the title screen, not in-game).
;   auto       - back buffer to begin with; after ~1 s with no UI found, re-derive it as the
;                last full-size target the frame drew into, and keep re-deriving whenever the
;                current choice goes quiet. Follows the move in both directions.
Target=auto
; How many draws into that target belong to the FRAME rather than to the UI. On this game the
; first draw is the tonemap/output pass and everything after it is Scaleform plus the sprite
; HUD, so 1 is right - verified in both places the UI lives (2 UI draws at the title screen,
; ~23 in-game). If the world image loses more than the HUD
; (a post pass went to the panel), raise it; if some HUD is still baked into the world, lower
; it. Numpad 8 steps it live in the headset - no need to take it off.
FirstDraw=1
; Diagnostic: once a second, log the frame's render-target census - which target took how many
; draws, in what order, and which of them are back buffers. This is what FirstDraw is read off
; when a game patch moves things around. Cheap, but noisy; leave off for play.
Probe=false
; Where the panel hangs.
;   body  - world-locked with a lazy follow: it stays put while you look around and re-places
;           itself when you turn or walk past FollowDeg / FollowRadius. The default, because
;           the compositor reprojects world-locked content perfectly at any submit rate while
;           head-locked content must move WITH the head between submits - and submits run at
;           one XR frame per stereo pair, so head-locking judders.
;   head  - welded to the view, like a visor.
;   world - dropped in the world and left there until Numpad . re-centres it.
Lock=body
; Metres in front of the eyes, and the panel's width in metres (height follows the game
; frame's aspect, which under GameRes=auto is near-square). Together these ARE the angular
; size: 2.4 m wide at 2.0 m away spans about 62 degrees, against the ~110 the raw frame
; spans - which is the whole point of the exercise. Bigger Width = the old, too-wide layout;
; smaller = a compact panel you can take in without moving your eyes.
Distance=2.0
Width=2.4
; Nudges, if the panel does not sit where you want it.
HeightOffset=0.0
YawDeg=0
PitchDeg=0
; 0..1. Multiplied into the panel's coverage, so the world shows through a dimmed HUD.
Opacity=1.0
; Where the panel's transparency comes from.
;
; There is no alpha channel to read: ELDEN RING's UI pipelines never write one (measured
; 2026-08-21 - keyed on the captured alpha, the entire HUD was invisible; keyed on
; brightness, every BLACK part of it was - menu panels, text outlines, the dimming behind a
; full-screen menu, which is why the inventory menu appeared to not show up at all).
;
; So "dual" does not key at all, it SOLVES for coverage. The same UI is captured twice in
; the same frame - once over a transparent-black clear, once over an opaque-white one (each
; UI draw is issued a second time into the second target). For any src-over blend:
;     over black:  B = s*a          over white:  W = s*a + (1-a)
; so  a = 1 - (W - B)  exactly, and the premultiplied colour is B. Opaque black comes out
; opaque, half-transparent comes out half-transparent, and it needs nothing from the game.
; Costs one extra full-size render target and one extra draw call per UI draw (~24 of them
; in the world, ~130 with a menu open) - unmeasurable against a 700-draw frame.
;   dual  - solve for coverage from the pair of captures. The default.
;   luma  - anything not black is UI (the old behaviour; loses black UI)
;   alpha - trust the captured alpha channel (on this game: nothing is visible)
;   max   - whichever of alpha and brightness claims more coverage
; dual falls back to max automatically if any UI draw turns out to depth-test, since the
; replay would then fight the real draw for the depth test. On 1.16.2 none of them do.
Key=dual
; Test switch, leave false. Redirects the UI even with no VR session to submit the panel
; into - which normally stands the redirect down, so that a headset that is not streaming
; leaves the HUD in the frame rather than nowhere. Set true only to exercise the capture
; path in an unattended flat run.
RedirectWithoutVR=false
; Draw the reconstructed panel back onto the game's own frame, so the monitor shows exactly
; what the headset gets - same coverage, same premultiplied blend the compositor uses. Off
; for play; on when you want to see what the capture produced without putting a headset on.
MirrorPanel=false
; Body lock only: how far the head may turn (degrees) or travel (metres) before the panel
; re-places itself in front of you.
FollowDeg=25
FollowRadius=0.5

[Buttons]
; Touch button -> XInput button. Names: A B X Y LB RB LT RT LS RS START BACK DPAD_UP DPAD_DOWN DPAD_LEFT DPAD_RIGHT none
; Default ELDEN RING bindings: A=jump/confirm B=dodge/sprint X=use item Y=interact (event action)/two-hand
;   LB=guard RB=light attack LT=skill RT=heavy attack LS=crouch RS=lock-on START=menu BACK=map
A=A
B=B
X=X
Y=Y
LeftStickClick=LS
RightStickClick=RS
; Left "menu" button: tap = START, hold >= MenuHoldForBack seconds = BACK (map).
Menu=START
MenuHoldForBack=0.45
LeftTrigger=LB
RightTrigger=RB
LeftGrip=LT
RightGrip=RT
TriggerThreshold=0.55
GripThreshold=0.60
; Hold left stick click + tilt = D-pad (switch spells / weapons / items). Tap = LS (crouch).
LeftGripPlusStickIsDpad=true
; Valve Index trackpads, pressed (the Index has no menu button: SteamVR keeps the system button for its
; dashboard). MENU = the menu button above (tap START, hold for the map), DPAD = the D-pad in the
; direction you press (press the pad's top, bottom, left or right edge), or any button name, or none.
LeftPad=MENU
RightPad=DPAD
; How hard a trackpad press is (0..1); it releases below 60% of this.
PadForce=0.5
; Valve Index grips: the squeeze force (0..1) that reads as a full grip. The grip's touch sensor reads
; fully closed as soon as your fingers rest on the handle, so ERVR reads how hard you squeeze instead.
; Lower it if grabbing takes too much force; 0 = the touch sensor, like before 0.6.5.
IndexGripForce=0.5

[Sticks]
Deadzone=0.15
Swap=false
RightSensitivity=1.0
; Glitch filter (2026-08-25): on a Quest Pro through VDXR the LEFT stick stream arrives corrupted - full-deflection
; samples jumping 30-180 degrees between 4 ms polls, plus full-deflection spikes while the stick is released (jerky
; zig-zag movement, "stuck on debris", lurches while standing). Quest 3 sessions are clean and the right stick never
; glitches. The filter constrains the samples to what a real thumb could do: deflection RISES at most
; GlitchRisePerSec (25 = idle to full in 40 ms, so an idle spike comes out under the deadzone), FALLS at most
; GlitchFallPerSec (30 = full to idle in 33 ms; 0 = instant, the pre-2026-08-31 behavior - but the corruption also
; drops a held tilt to zero for single samples, and an instant fall let each dropout restart the rise cap from idle,
; flattening a real sustained tilt into a permanently-dead ~0.1 stick: the right stick's "can't zoom the map"), and
; above half deflection the direction SLEWS toward the raw direction at GlitchSweepDegPerSec instead of jumping
; (per-poll garbage collapses to a few degrees of wobble; a real fast rim-roll is followed with ~50-100 ms lag). The
; output always converges on the raw stream - lag is the worst case, never a dead stick. ERVR.log "[stick] glitch
; filter reshaped ..." counts what it caught.
GlitchFilter=true
GlitchSweepDegPerSec=720
GlitchRisePerSec=25
GlitchFallPerSec=30

[Gestures]
; Swing the right controller to attack: above LightAttackSpeed (m/s) = light attack, above HeavyAttackSpeed = heavy.
; Swing the left controller to send LeftSwingButton (parry / shield bash / offhand attack).
Enabled=true
LightAttackSpeed=2.2
HeavyAttackSpeed=4.0
LeftSwingSpeed=2.4
LightAttackButton=RB
HeavyAttackButton=RT
LeftSwingButton=LB
Cooldown=0.35
PressDuration=0.09
; Only detect swings while that hand's grip is held (avoids accidental swings while gesturing).
RequireGrip=false
Haptics=true

[Movement]
; What "forward" on the move stick means: head (where you look - physically turning your head changes where
; stick-forward walks; what every VR game does), camera (the stick yaw only: physically looking around does NOT
; change the walk direction), hand (where the left controller points), body (where the body is turned, see BodyYaw).
Forward=head
; With CameraTurnByErvr: what the right stick turns - camera (the whole view, like a
; smooth turn) or body (the character only - the view stays where your head points).
RightStick=camera
; The turn stick drives ERVR's own view yaw instead of the game's camera (needs CameraYawSource=ervr, the default).
CameraTurnByErvr=true
TurnSpeed=120
; Right-stick X -> discrete turns of SnapTurnDegrees (or short pulses to the game if CameraTurnByErvr is off).
SnapTurn=false
SnapTurnDegrees=30
SnapTurnPulseSeconds=0.08
SnapTurnRepeatSeconds=0.30
; Rotate the move stick by (view yaw - body yaw). Leave false: ELDEN RING already moves you relative to the camera,
; and the camera is ours, so this only kicks in when the body has turned away (sprint, free-turn) and then makes you
; veer off at an angle.
RelativeToCamera=false

[Locomotion]
; game   = the game moves the character from the (virtual) stick: its own animation, collision, root motion (default)
; direct = ERVR integrates the position itself every frame: stick x/y (in the view frame) x speed, character faces the
;          view. EXPERIMENTAL: the game's collision/ground handling is bypassed for the horizontal motion (height still
;          comes from the game), so expect walking into geometry to misbehave. Only while the stick is pushed; with the
;          stick idle the game owns the character again (rolls, attacks, ladders keep working).
Mode=game
RunSpeed=4.5
SprintSpeed=6.5
; direct: still hand the stick to the game so run/strafe animations play (the game's own displacement is discarded).
FeedStick=true

[Haptics]
RumbleToControllers=true
RumbleScale=1.0

[bHaptics]
; Body haptics on bHaptics devices - a TactSuit (vest), TactSleeves (forearms) and a TactVisor - through the
; bHaptics Player: install it (bhaptics.com/software/player), pair your devices there and have it running; ERVR
; finds it by itself (ERVR.log: "[bhaptics] playing on ..."; the devices pulse twice when found). Without the
; Player nothing changes. All of these hot-reload.
; How strongly they play, percent; 0 = off (bhaptics_library.dll is then never loaded).
Level=100
; Blows you land (in that arm and shoulder), blocks and deflects, the two-hand grab, spells / arrows leaving the hand.
Combat=true
; Blows you take, on the side the attacker stands (the vest faces where your body does: a look over the shoulder
; does not turn it), heals, death, and the heart racing below 30% HP.
Damage=true
; The wind of a fall, and the landing (from the waist up, as hard as the fall).
Movement=true
; The game's own rumble (blows, a boss's stomp, criticals) on the vest, at most a quarter.
Rumble=true

[FirstPerson]
; ERVR takes over the game camera (first person anchored to your character) and drives the arm bones from the
; controllers so the equipped weapons follow your hands. ERVR renders the result itself (see [VR]).
; Only active on eldenring.exe 2.6.2.0 (game 1.16.2) or when the pattern fallbacks resolve; check ERVR.log "[game]".
Enabled=true
; Camera height above the character's root (meters).
EyeHeight=1.60
; Where the camera sits: head = on the character's head bone (the neck/shoulders/arms are under the view by
; construction, whatever the animation does - the way first-person mods do it), root = character root + EyeHeight
; (the body then has to be moved under the camera with BodyFollowsHead, which the run animation fights).
; On Torrent, either setting rides the seated pose's head (PoseMode=vr; the live rider head until a still moment
; in the saddle gives that pose, and on mount/dismount), smoothed by RideCameraSmoothing. The saddle height is
; already in that transform; standing EyeHeight is not added again.
CameraAnchor=head
; Seconds of low-pass on the head-bone anchor (removes per-frame animation jitter, keeps the run lean); 0 = raw.
; With PoseMode=vr, template height changes apply immediately; only the horizontal offset is smoothed.
; Terrain/root movement always applies immediately in every axis.
CameraAnchorSmoothing=0.06
; 0..1: how much of the head bone's own vertical motion (bob, crouch, run lean) the camera follows. 1 = the camera
; stays on the head (shoulders always the same distance below your eyes); 0 = flat (the run animation then drops
; the body ~15 cm under a camera that stays up).
CameraBob=1
; How the first-person camera is handed to the game:
;   pre         write it into the game's character camera, then let the game's camera step run (default)
;   post        run the game's camera step, then overwrite the final camera
;   block       replace the camera step entirely (erfps2 style)
;   passthrough do nothing to the camera (diagnostics: logs the game's own matrices)
CameraMode=pre
; Rotation written into the game camera: hmd (required - ERVR renders, so nothing else applies your head
; rotation), yaw (stick yaw only; no head tracking), game (also keep the game's pitch).
CameraRotation=hmd
; Where the view yaw comes from: ervr = ERVR's own yaw, integrated from the right stick (default; with OwnChrCam the
; game has no camera logic left that could move it, so view, body, hands and movement all sit on one number),
; game = read the game camera's yaw back (the right stick then goes to the game; its follow cam turns the view
; whenever the character moves).
CameraYawSource=ervr
; Put our camera back immediately after the game's follow-cam function writes its own (the follow cam is what turned
; the view when you walked at an angle, and it writes from several places per frame). The debug log line
; "[cam] foreign yaw found before N of M writes" tells whether any writer is still unaccounted for.
OwnChrCam=true
; (OwnHeadPosition / AddHmdPosition / RealHmdPositionScale / HmdYawInGameCamera were removed: ERVR owns
;  rendering, so the eye lands exactly where it writes the camera.)
; Play-space re-centring. The runtime reports your head relative to wherever it last recentred, and everything we
; place (camera, hands, body) is then rotated by the camera yaw - so standing half a metre off centre makes the view
; swing sideways every time you turn with the stick, and shoves the body with it. ERVR keeps its own origin that
; slowly follows your head: leaning and ducking still move the view, walking around the room does not. Without it,
; standing half a metre off the runtime origin makes the eye orbit the body on every stick turn ("the camera drifts
; sideways when I rotate"). Cost: a deliberate lean is absorbed over RecenterSeconds.
Recenter=true
; Seconds for the slow re-centring. Bigger = leans persist longer; 0 = hard lock (no positional head tracking at all).
RecenterSeconds=2.0
; Never allow more than this many meters between your head and the character.
RecenterMaxRadius=0.75
; Also absorb vertical drift, so the view stays at EyeHeight whatever your real height is.
RecenterHeight=true
; How the rendered body is posed:
;   vr   = the whole rig is written from a captured standing pose every frame, arms/torso from your controllers on
;          top. NO game animation ever poses the body - rolls, attacks, runs still MOVE the character (root motion
;          is untouched, so a dodge still displaces you) but they no longer play on the rig or drag the camera.
;          The pose is re-captured whenever you stand still for a second, so idle/crouch stances come through.
;          Grace/menus pause capture until 3 seconds after closing; the VR body and head anchor keep the saved pose.
;          Fingers retain the live equipment grip, so an open hand is never frozen until the next stance capture.
;   game = old behaviour: the game's animations play and ERVR layers the arm IK on top (animations fight the arms).
; On Torrent the rider is a seated pose taken from your own seat the first time it holds still in the saddle (kept
; for later rides), upright whatever Torrent's pitch, arms on the controllers - the gallop and jump animations no
; longer crouch the body forward under the camera. Both eyes draw the rider where the first eye placed it. Mounting
; and dismounting keep the native animation. The walking template resumes after dismounting. Torso twist, facing
; pins and direct locomotion are suspended while riding. Right-stick turns and physical turns (RideTurnsWithHead)
; rotate Torrent and the rider together. While fully mounted, the active horse's draw flags and opacity are restored
; (separate from NearDither). Summon/dismount fades remain native.
PoseMode=vr
; Keep the character's body facing the camera (strafe mode) unless a real enemy is locked on, so the arms can always
; reach your hands when walking backwards / sideways.
FaceCamera=true
; How that is done:
;   auto   = strafe when PoseMode=vr, else lock (default)
;   strafe = only set the "strafing movement" flag. The game's lock-on state stays off - important, because forcing
;            it (the old way) engages the game's LOCK-ON CAMERA, a camera writer ERVR does not hook: it orbits the
;            view around the character while strafing and eats right-stick turns.
;   lock   = old behaviour: force the lock-on state onto a fake far-away target.
;   off    = leave the game alone (body free-turns toward the move direction).
FaceCameraMode=auto
; How far ahead the fake lock-on point sits (meters, FaceCameraMode=lock only). The game's lock-on camera nudges its
; yaw to frame this point and we read that yaw back, so a close target turns strafing into a slow, self-feeding
; rotation. Keep this large.
LockTargetDistance=100
HideHead=true
; Hide the sheath/scabbard slots (the held weapons themselves are never hidden).
HideSheathedWeapons=false
; The game's near-camera dither fade: parts close to the camera go see-through (a checkerboard fade) over a band
; of metres tuned for the third-person camera, so with the camera on your head walls, doorways and anything you
; lean toward start vanishing well before you reach them.
;   0   = off while first person runs (nothing fades - what erfps2 does; the near plane just clips)
;   1   = leave the game's band alone
;   0.3 = keep the fade but scale its distances to 30% (any value between 0 and 1 works)
NearDither=0
; Write where you look into the player's aim matrix (bows / spells aim with your head).
WriteAim=true
; Controller-driven arms.
HandTracking=true
; Where controller positions are measured from: head (relative to the headset - safest), tracking (raw tracking origin),
; floor (raw minus EyeHeight).
HandOrigin=head
; Distance from the controller grip pose back to the wrist bone (meters).
HandBackOffset=0.06
; Calibration rotation controller -> hand bone (degrees). Adjust if the weapon points the
; wrong way in your hand. X=45 dialled in-headset on Quest 3 (Numpad 6/9 step it -/+15 live).
HandRotOffsetX=45
HandRotOffsetY=0
HandRotOffsetZ=0
; Elbow hint direction (relative to your facing): down / outward / backward weights.
ElbowPoleDown=1.0
ElbowPoleOut=0.6
ElbowPoleBack=0.3
; Let the arm stretch (forearm+hand bone lengths) up to this factor when your hand is beyond the character's reach.
ArmStretch=1.5
; Scale of controller offsets from the head (0.85 = bring hands 15% closer, if your arms are much longer than the character's).
HandScale=1.0
; Twist the torso so the chest always faces the camera yaw (arms stay reachable while running/turning).
; What the body - facing, shoulders, torso, elbows - turns toward: head (follows your real head yaw: physically
; turning your body turns the character too - 1:1), camera (the stick yaw only: physically turning leaves the
; body behind) or stick (CameraYawSource=ervr only: the right stick turns the body, absolute).
BodyYaw=head
; If the rendered body faces the wrong way, correct it here (180 = flipped). Debug lines print "root facing-cam".
BodyFacingOffsetDeg=0
; Smoothing of the body chasing the head (seconds, 0 = instant) and how far you can glance before it follows.
BodyYawFollowSeconds=0.25
BodyYawDeadzoneDeg=0
; On Torrent: free look. Within this many degrees either side of the way you face, looking around neither steers
; Torrent (the move stick's forward stays put) nor turns it. Turn further and the excess becomes the new forward:
; the stick steers along it and, with RideTurnsWithHead, Torrent and the rider turn with you at BodyYawFollowSeconds
; - the same pair turn the right stick makes. -1 = off (Forward=head then steers wherever you look).
RideFreeLookDeg=45
RideTurnsWithHead=true
; On Torrent the camera sits on the rider's seated head and Torrent's gallop bounce is smoothed out of the view, in
; the horse's own frame (its travel, turns and jumps pass straight through): this many seconds of smoothing, never
; more than RideCameraMaxDeviation metres. The rider moves with the smoothed view, so the horse moves under both
; and the body never rises into the camera. 0 = view and rider ride the saddle rigidly.
RideCameraSmoothing=0.15
RideCameraMaxDeviation=0.10
TorsoFaceCamera=true
; Shift the whole rig so its head bone sits under your eye: physically stepping or leaning moves the CHARACTER with
; you instead of sliding the camera off a body that stays put. The physics root (collision) does not move and the
; shift is clamped by the three limits below. With PoseMode=vr this is measured against the captured template, so
; it cannot feed back on itself; vertical only follows your own crouch, so the rig never floats off the ground.
BodyFollowsHead=true
BodyFollowMaxHorizontal=0.6
BodyFollowMaxDown=0.6
BodyFollowMaxUp=0.25
; Park the rendered body this many meters straight back (along its own facing) from where it would sit exactly
; under the camera. The eye is inside the head bone, so at 0 the chest/pauldrons hang in the bottom of the view;
; 0.04-0.08 clears the armor without the arms looking detached.
BodyBackOffset=0.08
; head = keep the character's head bone at the eye (whatever the animation does) | root = shift by the headset offset only.
BodyAnchor=head
; Yaw the whole rendered skeleton to BodyYaw every frame, so the shoulders face where your head/body faces right now
; instead of waiting for the game to turn the character (idle it only turns for large angles).
BodyRotate=true
; Which character root the camera anchor and arm bones are built on: model = position from the ChrCtrl model
; matrix - the transform the renderer actually skins the rig with - with the physics rotation (default; together
; with CameraAfterModelPos the camera and the rendered body sit on the same root by construction); physics = the
; physics module (the model matrix is rebuilt from it with its own filtering, so while moving the rendered body
; trails a camera built on physics - "hands and body lag behind until I stop"); modelmatrix = both from the matrix.
; If the lag comes back, the log lines "[cam] rig-root vs camera-root horizontal skew" and "[body] rendered head
; vs camera eye" say which transform is still off.
ArmRootSource=model
; Strafe mode: pin the character's physics facing to BodyYaw every frame, so walking toward your gaze is full-speed
; forward movement instead of a side-step (the game picks run vs strafe from the angle between move direction and
; facing). Dash/roll retain the game's turn toward the joystick throughout the action, including recovery;
; the visible VR body still follows BodyYaw. Set false if ladders or mounts misbehave.
PinBodyFacing=true
; Solve the arms on every Havok update instead of once per rendered frame. false is cheaper but a later animation
; evaluation in the same frame can throw the pose away (hands snap back to the run animation).
ArmSolveEveryCall=true
BoneTorso=Spine
; Bone names (c0000). If ERVR.log shows "arms L(-1,...)" look at the "[skel]" dump and fix these.
BoneLeftUpperArm=L_UpperArm
BoneLeftForearm=L_Forearm
BoneLeftHand=L_Hand
BoneRightUpperArm=R_UpperArm
BoneRightForearm=R_Forearm
BoneRightHand=R_Hand
DumpSkeleton=true
; Diagnostic (leave false): flip to true DURING PLAY to page-protect the live pose buffer for ~1 second and log the
; code address (RVA) of everything that reads or writes it ("[posescan]" lines). Expect a brief hitch. One scan per
; false->true flip.
PoseWriterScan=false
; Per-second "[fp]" debug lines with positions (needs LogLevel=debug).
Debug=false

[Combat]
; Physical melee. Instead of pressing R1/R2 (which plays an attack animation with animation-timed hitboxes),
; ERVR fires the game's own TAE "AttackBehavior" event on your character every frame while your controller is
; swinging. The game does the rest exactly as for a real attack: BehaviorParam/AtkParam lookup for the equipped
; weapon, capsule sweep along the weapon (which follows your hand), damage, poise, status, hitstop, stamina cost,
; one hit per enemy per swing. No attack animation plays; your arms are the attack.
;   Mode=buttons  : old behaviour, swings press LightAttackButton/HeavyAttackButton/LeftSwingButton ([Gestures]).
;   Mode=physical : swings invoke attacks directly (needs the judge ids below, learned or configured).
;   Mode=auto     : buttons until the light-attack judge id has been learned, then physical (default).
; Judge ids: which BehaviorParam_PC row (= which attack of the equipped weapon) a swing invokes. Observed in
; ER 1.16: R1 chain = 0 / 10 / 20, R2 = 100 (105 for some charged variants), left hand = 0. These defaults work
; out of the box; with Learn=true ERVR still refines them from the events the game fires right after it pressed
; R1 / R2 / L1 in buttons mode ("[combat] learned ..." in ERVR.log). SaveLearned=true (opt-in) writes learned
; ids back into this file. Two-handing has its own animations: set Mode=buttons for a moment to re-learn.
Enabled=true
Mode=auto
LightJudgeId=0
HeavyJudgeId=100
LeftJudgeId=0
Learn=true
SaveLearned=false
; While physical combat is active never send the light/heavy buttons (RB/RT): trigger and grip would otherwise
; play attack animations that move your arms. Menus still get them (tab switching).
BlockAttackButtons=true
; Diagnostic: rotate the attack slot (AttackIndex 0..N-1) per swing. Try 4 if enemies stop taking hits after the first.
AttackIndexRotate=0
; Swing detection uses the rendered WEAPON TIP displacement, along the calibrated shaft (TwoHandAxis).
; Without a rendered sample it uses controller velocity + angular velocity x the same shaft lever. The
; length, and where the mass sits along it, come from a per-category table (EquipParamWeapon wepType: dagger 0.35 m
; balanced 40% out, straight sword 0.95/35%, greatsword 1.25/40%, colossal sword 1.6/45%, great hammer 1.3/85%,
; shields 0.3-0.8 with the mass at the fist, ...). WeaponGeometry overrides entries as wepType:length:massFraction,
; e.g. WeaponGeometry=23:1.4:0.9,1:0.3:0.5. WeaponReachRight/Left stand in when the category is unknown.
WeaponReachRight=0.8
WeaponReachLeft=0.5
WeaponGeometry=
; KineticRefSpeed is defined for a KineticRefReach lever: quality 1 scales with the weapon's length over this, so a
; dagger is judged against a dagger's swing and a colossal sword against its own (0 = one speed for everything).
KineticRefReach=0.8
SwingOnSpeed=3.0
SwingOffSpeed=1.5
HeavySwingSpeed=6.0
; Controller (hand) speed required to start a swing; rejects wrist flicks that only move the tip.
MinHandSpeed=0.8
; Gated model: seconds to watch the peak before light/heavy selection; attack time limit; pause between swings.
ArmWindow=0.06
MaxSwingSeconds=0.6
Cooldown=0.25
; Left-hand swings attack with the left-hand weapon (shield bash / offhand weapon).
LeftHand=true
; No stamina = no swing (long buzz on that hand). The game's own stamina cost per attack still applies.
RequireStamina=true
MinStamina=1
; Stamina ERVR itself takes per swing on top of whatever the game charges (0 = game only). Use if swings feel free.
ExtraStaminaLight=0
ExtraStaminaHeavy=0
; ---- Kinetic combat: "damage is physics" -------------------------------------------------------------------
; Every strike gets a QUALITY: (virtual tip speed / KineticRefSpeed)^2 - kinetic energy - times how much arc
; the tip travelled before contact (a flick from rest counts 60%, a full windup 100%; the arc a weapon needs
; is KineticArc x (1 + weight/10): a dagger is a flick, an ultra greatsword a whole-body swing). Quality 1 is
; vanilla damage; below it the damage falls towards KineticMinMult (chip), above it rises to KineticMaxMult.
; WEIGHT (Inertia=true): the main grip stays at your controller. Weight resists bending the shaft around that
; grip, with more resistance for head-heavy weapons and less with two hands. Settling cannot overshoot or
; spring back; twisting the edge about the shaft stays under the main wrist's control. Inertia=false tracks
; orientation directly too. KineticAccel and KineticArmPerWeight apply only to the virtual-speed fallback
; (ArmPerWeight only in gated combat). Rendered inertia never pays a second invisible startup delay.
; Implemented by scaling the motion values of the attack row the strike resolves to (BehaviorParam_PC ->
; AtkParam_Pc), live in the loaded params, restored when the strike ends - nothing on disk changes, no
; regulation.bin edits, Seamless Coop-safe. Quality is refreshed every frame of the strike, so what counts is
; the speed at contact. A strike with quality >= KineticHeavyQuality (and a real windup) uses the heavy row.
; Stamina is fatigue: each strike drains the game's OWN stamina cost for that attack (BehaviorParam) x
; KineticStaminaScale x (0.5 + quality/2) - KineticStaminaPerStrike x (1 + weight/12) when the row is unknown -
; and under KineticFatigueStart of your stamina bar strikes weaken towards KineticFatigueFloor.
Kinetic=true
KineticRefSpeed=8.0
KineticArc=0.5
KineticAccel=60
KineticAccelWeight=2
Inertia=true
InertiaAngAccel=300
InertiaSpringHz=8
; Bending resistance uses weight x mass distance squared, including a distributed-length contribution so a
; centre-gripped twinblade still has rotational weight. Shaft twist does not carry this long-lever resistance.
InertiaComRef=0.5
; Angular approach speed is bounded by the stopping distance at this multiple of InertiaAngAccel.
InertiaBrake=3
; Two arms increase the available turning torque and tighten the angular response.
InertiaTwoHandTorque=2.0
; Maximum bending lag in radians; a hard 45-degree cap also protects older INIs. The old InertiaMaxLag,
; InertiaTwoHandForce and InertiaNoOverrun keys are ignored: grip position is direct and settling is always monotone.
InertiaMaxLagAngle=0.6
KineticArmPerWeight=0.012
; Global multiplier on every scaled strike - the difficulty knob (0.5 = everything hits for half).
KineticDamageScale=1.0
; CONTINUOUS model (default): the game's per-attack hit list does not deduplicate injected attacks - a blade in an
; enemy hits it EVERY FRAME - so instead of fighting that, each frame of contact is a hit sized by the tip's
; speed right now: 0 at rest, KineticContinuousMult of a vanilla hit at KineticRefSpeed (squared in between).
; A fast pass through an enemy integrates to about one vanilla hit; a slow push does nothing; dwelling on a
; target keeps cutting, weakly. KineticContinuous=false switches to the gated model: one hit per contact,
; the attack pausing KineticHitPause seconds after each (0 = the strike ends on its first hit).
KineticContinuous=true
; KineticSlices=false (default): a continuous contact still opens on any touch, but each swing lands ONE hit
; scaled by the swing's quality (QualityToMult, like the gated model) and is then spent - the next swing re-arms.
; ELDEN RING takes the enemy's flat defense off every hit, so the per-frame slices above (6-10% of a hit) dealt
; 3-5 HP each where a full hit deals hundreds. true = the per-frame slice model (KineticContinuousMult,
; KineticSwingBudget). With KineticStamina=off the strike's own stamina cost is 8 instead of 1 (refunded), so the
; game's on-hit charge marks YOUR hits even where no attacker is recorded (enemies a co-op partner's game owns).
KineticSlices=false
; Continuous contacts open immediately above OnSpeed, including wrist-driven blade arcs, and end below OffSpeed.
; They use the game's attack collision for enemies and world geometry. Slow touches have proportionally low
; damage; a resting blade does not attack. A short contact is retained until the game can process it once.
; SwingOnSpeed/OffSpeed, MinHandSpeed, ArmWindow, MaxSwingSeconds and Cooldown above govern the gated model.
; Continuous contacts last until motion stops or the swing damage budget is spent, including long windups.
ContactOnSpeed=9.0
ContactOffSpeed=4.5
; A contact whose damage budget is spent is an inert blade. It ends at the tip's next speed valley (below
; ContactValley x the swing's peak speed) or ContactSpentSeconds after it was spent, and the next swing starts a
; new contact. A long weapon's tip seldom slows to ContactOffSpeed mid-fight, so ending only at rest swallowed
; every swing after the first spent one.
ContactValley=0.4
ContactSpentSeconds=1.0
KineticContinuousMult=0.2
KineticHitPause=0.25
; The game charges the attack's stamina cost the frame a hit lands, so a KineticHitStamina drop during a strike
; is a landed hit (thud in that hand). KineticStamina picks what stamina means: off = out of the loop (no gate,
; no fatigue; the attack's own stamina cost is set to 1 in the live params for the strike and that 1 refunded,
; so the bar does not move from your attacks - play on damage alone), game = the game's own charges only,
; full = ERVR's fatigue drain and low-stamina weakening on top. Blocking still costs what the game says.
KineticHitStamina=3
KineticStamina=off
KineticMinMult=0.25
KineticMaxMult=1.2
KineticHeavyQuality=0.85
KineticStaminaScale=1.0
KineticStaminaPerStrike=8
KineticFatigueStart=0.35
KineticFatigueFloor=0.5
KineticPoiseScales=true
KineticStaminaDamageScales=true
; ---- Consistency pass (2026-08-31) ----------------------------------------------------------------------------
; EnemyWatch reads the game's own list of characters near you: a frame-over-frame HP drop on any of them is a
; LANDED HIT - the ground truth that drives the hit haptics, the per-swing budget and the strike log's damage
; accounting (the old stamina-drop proxy mistook shield blocks for hits and missed real ones).
EnemyWatch=true
EnemyWatchRadius=8
; EnemyWatchOwnHits: count only the drops YOU caused (each character records who hit it last). With a co-op
; partner or a spirit ash on the same enemy, their hits would otherwise read as yours - spending your swing's
; damage budget and buzzing your controller. Skipped drops show in Debug=true as "hit by someone else".
EnemyWatchOwnHits=true
; Weapons with a unique moveset (their own behaviorVariationId, e.g. Sword of Night and Flame = 214) have no
; attack rows of their own for the basic swings, so the game falls back to a class variation ERVR could not
; predict - the damage scaling then edited a row the game never read (that is the "sometimes one-shots"
; bug: those hits were full vanilla damage). Now every candidate row is edited AND, during a strike, the
; weapon's behaviorVariationId is pointed at the variation whose rows exist, so the game provably resolves
; the capsule and the damage ERVR scaled.
KineticAlignVariation=true
; A swing may deal at most this many vanilla hits' worth of damage (scaled by strike quality) no matter how
; long the blade stays in contact or how high the frame rate: touches always cut, totals stay predictable.
; 0 = unlimited (the old behaviour).
KineticSwingBudget=1.0
; After a strike's first landed hit the rest of that swing deals damage but NO hit reaction, hitstop or poise
; damage: an enemy flinches at most once per swing and cannot be stunlocked by resting the blade in it.
KineticFlinchFirstHitOnly=true
; Fatten the attack's hit capsules during a strike so a grazing touch registers (1 = the game's own radii).
KineticHitRadiusScale=1.3
; ---- Shields --------------------------------------------------------------------------------------------------
; With a shield in the left hand (EquipParamWeapon wepType 65/67/69 = small/medium/great) the left hand blocks
; instead of striking. Shield UP - anywhere in front of you above the hips - holds the guard button
; continuously (released BlockReleaseSeconds after it drops). The BLOCK QUALITY (facing 50%, coverage of the
; head/chest line 35%, steadiness 15%) only shapes how good the block is: it scales the shield's guard
; absorption and stability the same live-param way, so a sloppy block leaks damage and eats stamina while a
; squared-up braced one is a wall. A hit taken while the shield moves INTO the attack faster than DeflectSpeed
; is a deflect: the stamina it cost is refunded (hard buzz). ShieldNormalPitch rotates the shield's face normal
; from the controller's forward axis (degrees): -90 = the controller's -Y axis, which is what faced forward in
; the 2026-08-24 calibration; with Debug=true a 1 Hz "[combat] shield:" line shows the axes if yours differ.
Block=true
GuardButton=LB
ShieldWepTypes=65,67,69
BlockReleaseSeconds=0.35
BlockMinCut=0.4
BlockMinStability=0.5
ShieldNormalPitch=-90
DeflectSpeed=1.2
BlockImpactStamina=4
ExtraStaminaLeft=0
; ---- Two-handing: grab the weapon with your other hand ---------------------------------------------------------
; Put your free hand on the hilt - controller within TwoHandGrabRadius of the weapon axis, TwoHandGrabMin..Max
; metres down the hilt from the other controller (positive = toward the pommel; Debug=true logs "two-hand
; geometry" while a grip is held) - and SQUEEZE its grip. That is the whole gesture: the grip alone is the hold,
; you stay two-handed for exactly as long as it is squeezed no matter where the hands move, and opening it is the
; only release. The squeeze must be fresh (a grip already closed for ~0.75 s when the hand arrives is ignored -
; open it and squeeze again), so guarding or habit never grabs. ERVR sends the game's OWN two-hand chord
; (TwoHandModifierButton + LightAttackButton for the right weapon, + GuardButton for the left: Y + RB / Y + LB in
; the default bindings) and reads ChrAsm.arm_style back as the authority, so the strength bonus, the two-handed
; attack rows and everything else come from the game. Both hands buzz when it engages, a short tick on release,
; a strong buzz when the game refuses the chord 3 times. Swapping a weapon un-two-hands, as in the game; the
; chord is accepted at human speed only (TwoHandChord* below); a manual Y + RB still works. Closing
; the RIGHT hand on the LEFT weapon two-hands that one. While two-handed the free hand rides the weapon shaft
; (TwoHandPinHand: it follows the inertial weapon instead of drifting off it) and never swings on its own.
; Two-handed attacks have rows of their own: with Mode=auto and Learn=true the first two-handed light / heavy
; swing presses the button once so the game teaches them ("[combat] learned light-2h ..."), or pin them here
; (R1 two-handed = judge 200, learned 2026-08-25; the heavy row is learned on the first two-handed heavy swing).
; "[combat] arm style A -> B" in the log confirms the switch; a chord the game refuses 3 times is logged once.
TwoHand=grab
TwoHandModifierButton=Y
; Chord timing (s): modifier held this long before the key, key held, modifier kept after. The game counts the chord
; in ITS OWN frames - sized to survive ~15 fps (a GPU-bound stereo session at 32% game speed ignored shorter chords,
; 2026-08-25 19:22). Holding the physical Y
; yourself lets the trigger through the attack-button block, so the chord can also be made by hand.
TwoHandChordLead=0.35
TwoHandChordPress=0.25
TwoHandChordTail=0.15
; The hilt runs along the controller HANDLE (TwoHandAxis=handle, its -Y toward the pommel); "forward" uses the aim axis.
; TwoHandGrabMin/Max are metres toward the pommel from the weapon hand: the second hand sits 0.05-0.20 m down the hilt.
TwoHandAxis=handle
TwoHandGrabRadius=0.18
TwoHandGrabMin=-0.15
TwoHandGrabMax=0.45
TwoHandPinHand=true
; The pinned hand keeps its wrist angle relative to the weapon at the moment the grab registers, then turns
; with the weapon (TwoHandPinOrient=false follows its own controller's free rotation). TwoHandPinSideOffset
; shifts it that many metres sideways off the hilt axis so the wrist clears the shaft; negate to flip sides.
TwoHandPinOrient=true
TwoHandPinSideOffset=0.03
; Both controllers steer the weapon relative to their separation when the grab takes hold, preserving the initial
; wrist alignment and allowing for the controllers' sideways offset. Only the main wrist controls shaft twist;
; the support position steers bending. Steering and release blend smoothly; overlapping
; controllers hold the last direction. False = the weapon controller alone points the blade.
TwoHandAim=true
TwoHandLightJudgeId=200
TwoHandHeavyJudgeId=-1
; ---- Skill (Ash of War) while two-handed ----------------------------------------------------------------------
; With both hands on the weapon, TwoHandSkillButton (a VR control: RTrigger RGrip LTrigger LGrip A B X Y RThumb
; LThumb none; the right trigger does nothing else in physical combat, RB being blocked) fires the weapon's skill.
;   TwoHandSkill=effect : the EFFECT without the animation. A skill's effect is a handful of TAE events its animation
;                         carries - AddSpEffect_WeaponArts (331, the buff / the fizzle if FP is short), AddSpEffect
;                         (67/66), BulletBehavior (2, projectiles from the weapon's dummy-polys), FFX - and ERVR
;                         replays exactly those, at their recorded times, through the same event slots physical
;                         melee uses: no animation, no lock, no root motion. The skill's own AttackBehavior is not
;                         replayed - it ARMS your next swing (SkillSwingWindow s) with the skill's attack row, so
;                         a Stamp or a Lion's Claw is the strike you make. Recorded per weapon + ash the first time
;                         you use it (that first press plays it the game's way and captures its events, "[combat]
;                         skill recorded ..."), kept for the session. Hold the trigger TwoHandSkillRelearnHold s to
;                         play it the game's way again and re-record (after changing the ash, or if a replay misses
;                         something). FP / stamina costs are the game's (SwordArtsParam, via the applied gem);
;                         SkillChargeFP charges them and refuses without enough FP (long buzz).
;   TwoHandSkill=game   : the press is sent to the game (SkillButton) - full animation, as if you pressed L2.
;   TwoHandSkill=off
; SkillReplayEvents lists the TAE event ids replayed; Debug=true logs every event a recording sees ("skill rec: ...")
; so an id a skill needs can be added. Charged (hold) skills replay their tap version.
TwoHandSkill=effect
TwoHandSkillButton=RTrigger
SkillButton=LT
TwoHandSkillRelearnHold=1.0
SkillReplayEvents=331,67,66,2,96,110,112,120
SkillRecordSeconds=3.0
SkillSwingWindow=2.5
SkillChargeFP=true
; ---- Cast aim: ranged spells, skills and bows fly where the casting hand points ------------------------------
; Unlocked, the game aims a bullet from the player's aim view matrix (which [FirstPerson] WriteAim fills from your
; head) and the fake lock-on target point, and the cast animation's SetBulletAimAngle event (TAE 238) clamps that
; aim with limits and deadzones sized for a camera a few degrees off the body. With a casting hand ERVR fills the
; matrix and the target from the CONTROLLER's ray instead - pitch included - and relaxes the event (deadzones
; zeroed, limits raised to CastAimLimitDeg; the erfps2 first-person mechanism). A real lock-on still wins: the game
; aims at the enemy. Log: "[combat] cast aim: ..." and the heartbeat's "cast aim right hand (cast live)".
;   What arms it: ONLY the game's own aim events - SetBulletAimAngle (238) at a cast's start and BulletBehavior (2) at
;   every bullet the player fires - and the aim stays live CastAimSeconds after the last one. A press never arms it:
;   guard and grip-mapped buttons are presses too, and forcing the lock on them made the game turn the body after
;   the hand (2026-09-04). Outside a live cast the head aims exactly as before.
;   CastAimHand=auto  : the hand whose attack/skill button the game was handed last, within 3 s (RB/RT = the right
;                       weapon, LB = the left weapon unless it is a shield, LT = the skill; two-handed = that weapon's
;                       hand); else the hand holding a CastAimWeaponTypes class (staffs 57, seals 61, bows 50/51/53,
;                       crossbows 55/56, perfumes 89, throwing blades 91); else the right. A ranged class in the
;                       attacking hand also lets RB/RT through BlockAttackButtons: with a staff, the trigger casts.
;   CastAimHand=right / left : always that hand.
;   CastAimAxis=aim   : the ray is where the controller points (grip -Z: a wand); handle = up the handle (+Y), the
;                       staff's own direction. CastAimPitchOffsetDeg tilts the ray (positive = up).
;   CastAimTurnBody   : during a live cast also steer BodyYaw (the visible rig + camera anchor) toward the ray. Off:
;                       your body stays where your head is; the game turns the physics character toward the lock
;                       target underneath, invisibly under PoseMode=vr. On, the rig and the camera swung with the arm
;                       during every cast and snapped back after it.
;   CastAimForceLock  : FaceCameraMode=strafe only. During a live cast also force the lock-on state onto the ray's far
;                       point: the lock target is what aims an unlocked spell (erfps2's way; FaceCameraMode=lock has
;                       the state forced anyway). The game's own lock-target update rewrites that state every frame,
;                       so ERVR re-forces it right after that update ("[game] lock-target update hooked" in the log).
CastAim=true
CastAimHand=auto
CastAimSeconds=0.5
CastAimAxis=aim
CastAimPitchOffsetDeg=0
CastAimTurnBody=false
CastAimLimitDeg=80
CastAimForceLock=true
CastAimWeaponTypes=50,51,53,55,56,57,61,89,91
; Swallow AttackBehavior events coming from animations (a stray R1, jump attack) while physical combat is active.
SuppressAnimAttacks=false
; On Torrent: physical = swings strike with the blade exactly as on foot (the default) | buttons = a swing presses
; the game's own mounted attack instead (light / heavy by the swing's quality, the left hand = the guard button).
; The "[combat] 5 s" line says how close mounted strikes came to an enemy, so a miss reads as out of reach or not.
RideAttacks=physical
; Log every swing start/end and every AttackBehavior the game fires for you (needs LogLevel=debug).
Debug=false

; Any open menu (pause, equipment, talk, map) stands physical combat down completely: no swing
; detection, no injected attacks, no guard hold, no two-hand chords, and the live param edits are
; restored while the menu is up. The equipment menu refuses weapon changes while the game sees
; combat state ("cannot change weapons now"), so leave this on outside debugging.
MenuGate=true

[WeaponWheel]
; Hold a grip with that hand still and a wheel of the hand's three weapon slots opens around it, with the game's
; own item icons. Move the hand over a weapon and let go to switch to it; let go in the middle to switch nothing.
; Slot 1 sits at the top, slot 2 down and outward, slot 3 down and inward - always the same place, so a slot
; becomes one movement. A gold pip marks the weapon in hand, a dot marks where your hand is over the wheel.
; The switch is the game's own: ERVR presses D-pad right (right hand) or left (left hand) until the game's
; active slot is the one you picked, so the game's switch animation and rules apply - it ignores switches
; mid-attack or mid-roll, and a refused switch buzzes after SwitchTimeout. A weapon two presses away would show
; the one in between, so with Switch=jump the hand's active slot is first moved to the slot before your pick
; (in the save's and the character's equipment alike, checked to match first) and one press does the rest.
; The grip keeps its other jobs. Closed at the other weapon's hilt it is the two-hand grab, and while two-handing,
; in a menu or with an empty hand the wheel stays shut and the grip does what it always did. A swing never
; opens it: the hand must stay under StillSpeed for the whole hold. Otherwise a quick squeeze (shorter than
; HoldSeconds) is passed on as one tap of the grip's [Buttons] mapping (LeftGrip=LT = the skill); to hold that
; button down with the grip, set Hands to the other hand.
; With [Gestures] RequireGrip=true the grip is your swing trigger - set Hands to the hand you do not swing with.
; A long squeeze that does not open the wheel says why in ERVR.log ("[wheel] ... without opening the wheel: ...").
; Icons are read from the game's own archive (menu/hi/00_solo, the inventory's item pictures) in the background
; as soon as your equipment is known; nothing is written to disk. A weapon whose icon is not in that archive
; shows its slot number instead.
Enabled=true
; both | right | left | off
Hands=both
; Seconds the grip must be held, with the hand still, before the wheel opens.
HoldSeconds=0.35
; m/s: a hand moving faster than this restarts the hold (a swing with the grip squeezed never opens the wheel).
StillSpeed=0.8
; Metres across; the weapons sit 0.3 x Size from the centre (9 cm at 0.30).
Size=0.30
; Metres from the centre where letting go switches nothing.
DeadZone=0.035
Opacity=1.0
Haptics=true
; jump  - a weapon two presses away: one switch, straight to it (see above)
; cycle - press the game's switch once per slot in between, exactly as a gamepad would
Switch=jump
; Seconds the game gets to answer each D-pad press before it counts as ignored (two ignored presses end the try).
SwitchTimeout=1.0

[Belt]
; The four pouch items the game gives a shortcut hang around your waist as objects, with the game's own icons and
; their counts: pouch slot 1 (top left in the equipment menu's pouch) front left, 2 (top right) front right,
; 3 (middle left) on the left hip, 4 (middle right) on the right hip. Reach down and close a grip on one to take it,
; press UseButton (X) while you hold it to use it, open the hand to put it back. Using it is the game's own pouch
; shortcut: ERVR holds PouchButton (Event Action, Y) and then presses that slot's D-pad direction, so the game's
; rules, animation and counts apply. UseButton with nothing taken from the belt is the button it always was.
; The belt hangs under your neck, not your eyes, so looking down at it does not move it; it turns with your body
; (your head may look FollowDegrees to either side first) and holds still while a hand is at it.
; A grip that takes an item is the belt's until it opens: never a two-hand grab, a weapon wheel or the grip's
; [Buttons] mapping, and that hand does not swing. The squeeze must be fresh: a grip already closed passing by
; takes nothing.
; Because the shortcut holds Y, using an item right beside something you can interact with (a grace, an item on the
; ground) interacts with it instead - exactly as the pouch does on a gamepad.
; Every use is checked against what the game did next and said in ERVR.log ("[belt] slot N: the game used ...").
; If a use took ANOTHER slot's item, ERVR swaps the two directions for the session and says the Directions line to
; keep; if the D-pad press arrived as a plain spell/item/weapon switch, it says to raise ChordLead.
Enabled=true
; both | right | left | off: the hands that take items.
Hands=both
; A | B | X | Y: the button that uses the item in your hand.
UseButton=X
; Metres below your eyes (head upright) where the items hang. Lower it if you play standing and tall, raise it seated.
Drop=0.60
; Metres out from your spine.
Radius=0.19
; Degrees around the waist for pouch slots 1-4: 0 = straight ahead, positive = to the right.
Angles=-30,30,-80,80
; Metres across each item.
Size=0.09
; Metres: a grip closing this close to an item takes it.
GrabRadius=0.11
; Degrees your head may look to either side before the belt turns with it.
FollowDegrees=45
; 0..1 for items no hand is at (an item a hand reaches is shown fully).
Opacity=0.85
Haptics=true
; The game's Event Action button, held for the pouch shortcut (an XInput name).
PouchButton=Y
; The game's D-pad direction for pouch slots 1-4 (its controls list: top left up, top right right,
; middle left left, middle right down).
Directions=up,right,left,down
; Seconds Event Action is held before the direction goes down; shorter and the game reads a plain D-pad switch.
ChordLead=0.40
; Seconds the direction is held with it, and Event Action after the direction is let go.
ChordPress=0.20
ChordTail=0.15

[Cheats]
; Offline testing helpers. SetAllStats=N sets EVERY stat to exactly N once (raising or lowering, level adjusted) - it edits the save.
SetAllStats=0
; SetLevel=N reaches exactly level N once: the difference comes off the highest stats (or goes onto the lowest),
; so the build keeps its shape until a respec, and ERVR then writes SetLevel=0 back here so a later level-up is
; never undone. Also edits the save.
SetLevel=0
; InfiniteStamina=true takes the stamina bar out of play: ERVR refills it to max every combat frame, after its own
; hit / blocked-hit detection has seen the game's charge, so attacks, blocks and sprinting never drain it (no guard
; break, no exhaustion) while the hit / deflect haptics keep working. Hot-reloads.
InfiniteStamina=false

[MenuNav]
; Menu navigation: while a game menu is open the LEFT stick becomes a held D-pad (tilt = press, keep tilted to
; auto-repeat), stick movement is not sent, and swing gestures are muted (a swing in the inventory would switch tabs).
; The map is deliberately excluded (the stick pans there).
Enabled=true
; Stick deflection that counts as a D-pad press.
Threshold=0.55
; How ERVR knows a menu is open - it reads the GAME's own menu state, three readers (log tag [menu]):
;   menuman CSMenuManImp+0x1C bit 0x10 - measured on 2.6.2.0: flips on the exact frame the pause menu opens and
;           closes (in step with the cursor UI element, ui_states[0x1C] at +0xAC).
;   hud     CSFeManImp.hud_state: 1 = pause menu open, 2 = talk menu (grace, shop, level-up, dialogs), 0/3 = no menu.
;           Measured 3<->1 in step with menuman.
;   chain   the hand-found MenuChain byte below (legacy).
; A reader is trusted only after it has been seen in BOTH states, so a byte that never moves cannot freeze the stick.
; Source=auto: chain if trusted, otherwise ANY trusted reader saying "open" counts (so a talk menu is caught by
; whichever of the two flips for it). Force one with Source=menuman|hud|chain, or Source=start for the old behaviour.
; Until a reader is trusted (and with Source=start), FollowStartButton=true guesses from our own START press (on) and
; the next START/BACK (off) - which is why closing a menu with B used to leave the stick in D-pad mode until the next
; START cycle.
; Hold the left stick click for ToggleHold seconds WITHOUT tilting to toggle by hand (0 disables); the left controller
; buzzes long = on, short = off. The override lasts until the game state agrees with it or the next START press.
Source=auto
FollowStartButton=true
ToggleHold=0.5
Haptics=true
; Memory flag (optional). MenuAOB resolves the CSMenuMan* global (verified once on eldenring.exe 2.6.2.0).
; MenuChain = pointer chain from that global to a byte that is nonzero while a menu is open, e.g. "0x8,0x1F0".
; To find it: set Scan=true and LogLevel=info, open/close the inventory a few times, and look for "[menuscan] +0x...:"
; lines that flip once on open and once on close; then set MenuChain=0x<thatoffset> (offsets inside the object need
; only one hop; a nested object needs "0x<ptr>,0x<field>"). Set Scan=false afterwards.
MenuAOB=48 8B 0D ?? ?? ?? ?? 48 8B 53 08 48 8B 92 D8 00 00 00 48 83 C4 20 5B
MenuAOBOffset=3
MenuAOBInstrLen=7
MenuChain=
Scan=false
ScanSize=0x400

[Patches]
; In-process port of uberhalit's EldenRingFpsUnlockAndMore (MIT). 0 leaves the game's 60 fps
; cap alone; 30..360 rewrites the frame-tick constant = the frame LIMITER. It does not set
; game speed: the sim consumes the measured frame time (in-game clock x0.98 of real time at
; 52 stereo pairs/s, 2026-10-31). Also removes the forced 60 Hz on exclusive-fullscreen
; resolution changes. Applied once at startup. The limiter runs once per stereo PAIR, and in
; VR [VR] LimiterFollowsHeadset raises it above the headset's refresh automatically, so this
; value only matters flat (or with that switch off). Pass 2 is frozen by Pass2Steps regardless.
FpsTarget=72

[Physics]
; Kinetic Elden Ring VR physics layer (blocking, embedding, pushing, grabbing, throwing).
; Under development. false = behave exactly like upstream ERVR.
Enabled=false
; M1 spike: characters within TrackRadius m are logged as "[phys] near: ..." when they come close,
; with a summary every 10 s. DumpBones logs each new skeleton's bone names once.
TrackRadius=6
DumpBones=true
; S1 test (off while TestBone is empty): the nearest character within TestRadius m gets bone TestBone
; rotated by TestDeg degrees about its local TestAxis (x, y or z), on top of its animation. Try
; TestBone=R_UpperArm. Hot-reloads: edit, save, and watch the enemy in the headset.
TestBone=
; x runs along the bone, so it only twists it; z swings the arm up (seen in-game 2026-11-05).
TestAxis=z
TestDeg=90
TestRadius=4
; M2: B&S-style sword (needs a build with PhysX; the log says "[phys] sword: PhysX ..." at startup).
; Your hand and weapon become one physics body with real mass, pulled toward the controller by an arm
; with limited strength. Heavy weapons lag, sag and overshoot; light ones stay crisp. Replaces
; [Combat] Inertia while Enabled=true and Sword=true. Mass = ER weapon weight * SwordKgPerWeight + SwordHandKg.
; Arm strength grows with STR: force = SwordForceBase + SwordForcePerStr*STR (N), wrist torque =
; SwordTorqueBase + SwordTorquePerStr*STR (N*m), times [Combat] InertiaTwoHandTorque when two-handing.
Sword=true
SwordKgPerWeight=0.3
SwordHandKg=1.0
SwordForceBase=300
SwordForcePerStr=10
SwordTorqueBase=60
SwordTorquePerStr=2.5
; How stiffly the grip follows (springs) and how quickly it settles (dampers). Higher spring = tighter.
SwordLinearSpring=4000
SwordLinearDamper=120
SwordAngularSpring=1500
SwordAngularDamper=60
; How far the blade may swing past where your wrist points (overshoot), in degrees. It depends on how heavy
; the weapon is FOR YOU: load = the weapon's weight torque / your wrist torque (STR, two hands). A weapon that
; is light for you stays within SwordMinAngleDeg (precise); at load SwordLoadForMax or more it may trail by
; SwordMaxAngleDeg (it swings you). The blade never rolls about its own edge on its own (your wrist owns that).
SwordMinAngleDeg=30
SwordMaxAngleDeg=60
SwordLoadForMax=0.6
; Further than this (m) from your real hand, the grip snaps back (teleport, menus, lost tracking).
SwordSnapDistance=0.6
; Log how far the sword lags behind your hand every 5 s ("[phys] sword: ...").
SwordLog=true
; M2.5: your blade against enemy arms and weapons. The upper arms, forearms and right-hand weapon of
; enemies within ContactRadius m become solid for the simulated blade: it stops on them (how far it gets pushed
; depends on your arm strength). Each hit swings that enemy arm about its shoulder by the impulse of the blow
; (heavier, faster swings move it further), and it springs back into its animation. Its hitbox goes with it.
Contact=true
ContactRadius=4.5
; How the enemy arm resists: inertia about the shoulder (kg*m^2), how hard it pulls back into its animation
; (N*m/rad), damping (1 = no bounce), and the largest swing (deg).
EnemyArmInertia=0.3
EnemyArmStiffness=20
EnemyArmDamping=1.0
EnemyArmMaxDeg=45
; The enemy weapons: the nodes of its model they hang on, per model number (the c#### of the enemy, logged as
; "npc ####"): "4311:R_Weapon_Spear,L_Weapon_Shield;4310:R_Weapon_Sword". Each one's shape is the box its mesh
; fills in the model data (logged as "[phys] weapon nodes"); a node named *Shield* blocks and never damages you,
; an L_ node is held by the left arm. The model data holds every weapon the model can carry (sword, spear, pick,
; shield...); which one an enemy shows is not read yet, so it is named here. A model not listed: EnemyWeaponBone,
; with its mesh's box when the model has one, else EnemyWeaponLength (m) along EnemyWeaponAxis (x, y or z; -x
; flips; auto = learned from the hits you take, kept in KineticWeapons.txt).
EnemyWeapons=4311:R_Weapon_Spear,L_Weapon_Shield
EnemyWeaponBone=R_Weapon_Sword
EnemyWeaponAxis=x
EnemyWeaponLength=1.0
; The enemy weapon is a physics body, not a wall: the enemy's arm drives it along its attack with at most
; EnemyArmForce (N) at the grip and EnemyArmTorque (N*m) about it. Your blade in its path pushes back with your arm
; (SwordForce*/SwordTorque*, doubled two-handed): stronger holds it off (its arm is turned to carry it, and a blow
; held off you does no damage), weaker is pushed through. Near your hilt you hold more than at your tip: your
; arm holds the blade by turning it, so at a point d m from your grip you resist about SwordTorque / d (100 N*m
; one-handed: ~170 N at mid-blade, ~330 N two-handed). 200 N / 60 N*m: a soldier's blow gets through a
; one-handed block near the tip, not a two-handed one or one near the hilt.
EnemyWeaponKg=3
EnemyArmForce=200
EnemyArmTorque=60
; An enemy shield is a plate the left arm holds the same way: its mass (kg), the force (N) at the grip and the
; torque (N*m) about it. A hard blow on its rim twists it (rim distance x force beats the torque), a hard blow
; anywhere pushes it and the arm back, and the arm carries it back into its guard.
EnemyShieldKg=5
EnemyShieldForce=200
EnemyShieldTorque=60
; Upper-body sway: a blow or push on the torso or head turns the upper body about the pelvis (inertia kg*m^2,
; stiffness N*m/rad, damping 1 = no bounce, largest sway deg) and it springs back into its animation.
TorsoSway=true
TorsoInertia=4
TorsoStiffness=200
TorsoDamping=1.0
TorsoMaxDeg=20
; Log contacts and arm swings every 5 s ("[phys] contact: ...").
ContactLog=true
; The body (torso, head, thighs, calves) is solid too. The energy of the blow where it lands (0.5 x mass x
; speed^2 of the blade, J, scaled by your STR) decides: a slash of BodyCutEnergy or more cuts through, of
; BodyStickEnergy or more sticks in, anything weaker glances off. A thrust (tip first) of BodyPierceEnergy or
; more goes in; push to drive it deeper, pull to draw it out, both against BodyFriction (N*s/m).
BodyContact=true
; The enemy body is the game's own body shapes: the capsules of its Havok ragdoll, the ones the game's attacks
; hit, each on the bone it follows (arms, trunk, head, legs). If they cannot be read for an enemy, hand-made
; capsules are used (the trunk two upright capsules side by side plus bars across the shoulders and hips).
GameBodyShapes=true
; Diagnostics: log where an enemy model keeps the dummy points along its weapon ("[dmy]", once per enemy kind;
; may stutter once when it runs).
DummyProbe=false
; Thickness multiplier for the body capsules (1 = as the game has them / an armoured soldier).
BodyScale=1.0
BodyCutEnergy=500
BodyStickEnergy=120
BodyPierceEnergy=80
BodyFriction=300
; Strike gate: ERVR's strikes use the game's attack collision, which hits whatever hurtbox the blade sweeps -
; so a blade laid on an enemy's sword or arm used to count as a hit. With GateStrikes the game's collision only
; counts where the simulated blade really struck: a body part cut, stuck or pierced (BodyStickEnergy or more), or
; an arm hit with ArmHitEnergy (J) or more. A parry, a push on the arm or a glance deals no damage.
GateStrikes=true
ArmHitEnergy=500
; Hit judge: no guard button. An enemy blow hurts only if its weapon reached your body (a capsule from your
; feet to your eyes, BodyRadius m): held off by your blade or missed, the HP the game took comes back. A touch
; does damage in proportion to the weapon speed (EnemyWeaponRefSpeed m/s = full, never under GrazeMin). A shield
; (ShieldRadius m at the left grip) always holds and costs ShieldStaminaPerDamage stamina per HP of the blow.
; Damage with no enemy weapon near you (spells, arrows, falls) is the game's. With [Combat] Block on, the shield
; is the game's own guard instead (raise it in front of you; stamina and guard breaks as in the game).
HitJudge=true
HitWindow=0.35
BodyRadius=0.22
ShieldRadius=0.35
ShieldStaminaPerDamage=1.0
EnemyWeaponRefSpeed=6
GrazeMin=0.15
; Swing stamina: swinging costs stamina while the blade tip moves faster than SwingStaminaSpeed (m/s), at
; SwingStaminaPerSec per second for an 8 m/s swing (x (speed/8)^2, more for heavy weapons). Below TiredBelow of
; your bar the arm weakens down to TiredStrength x its force at 0 stamina: the blade gets sluggish and hard to
; speed up. The game may regenerate it only SwingRegenDelay s after the last swing stamina was spent.
SwingStamina=true
SwingStaminaSpeed=5
SwingStaminaPerSec=5.5
SwingRegenDelay=1.2
TiredBelow=0.25
TiredStrength=0.4

[Experimental]
; M2 spike (true stereo): locate ELDEN RING's frame task-group table and dump it to the log
; under "[m2]". Read-only reconnaissance - it scans process memory once, costs a second or
; two at startup, and changes nothing. Needed to work out whether the draw phase can be
; re-driven with a second camera.
TaskProbe=false
; The rest of the M2 instrumentation (all default off; each needs TaskProbe=true):
;   TaskRegisterTest   - register no-op probe tasks into FrameBegin/GameSceneDraw/DrawEnd and
;                        log their per-frame cadence and dt.
;   TaskQueueProbe     - hook CSTask::queue_tasks (the frame driver) and log caller/timing.
;   TaskDumpLists      - dump every task group's registered tasks with RTTI class names.
;   TaskDoublePumpTest - A/B the draw-only second engine pass (the full-stereo mechanism).
;   TaskToggle=<name> + TaskToggleMode/Delay/Seconds/Cycles - gate one group on/off in cycles.
TaskRegisterTest=false
TaskQueueProbe=false
TaskDumpLists=false
TaskDoublePumpTest=false
TaskToggle=
; Unattended runs: after the autopilot reaches the world, keep panning the camera (right
; stick only, no interactions) for this many seconds so screenshots show motion.
AutoPilotWiggleSeconds=0
; Hand aim: while holding right grip, camera yaw/pitch follow the right controller (bows, spells).
; Needs a pointer to the game's camera angles, which changes with game patches. Leave off unless you
; supply the values below (see README "Hand aim").
HandAim=false
CameraAOB=
CameraAOBOffset=3
CameraAOBInstrLen=7
CameraChain=
CameraYawOffset=0
CameraPitchOffset=4
HandAimStrength=1.0
